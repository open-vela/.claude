# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

# This repository only carries documentation and agent skills, so there is
# nothing to build. Call the CLA workflow directly instead of the full CI
# entry point, which would otherwise fan out to the platform build matrix.
jobs:
  cla:
    # Run automatically for PRs, or when /check-cla is posted.
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && contains(github.event.comment.body, '/check-cla'))
    uses: open-vela/public-actions/.github/workflows/cla.yml@dev
    secrets: inherit
